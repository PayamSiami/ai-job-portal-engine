name: Deploy to VPS

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Debug - Show files and versions
        run: |
          echo "=== Node Version ==="
          node --version
          echo "=== NPM Version ==="
          npm --version
          echo "=== Package.json ==="
          cat package.json | head -20
          echo "=== Package-lock exists? ==="
          ls -la package-lock.json || echo "package-lock.json NOT FOUND!"
          echo "=== Directory contents ==="
          ls -la

      - name: Debug - Try npm ci with verbose
        run: npm ci --verbose
        continue-on-error: true
        id: npm_ci_attempt

      - name: Debug - Show npm ci error
        if: steps.npm_ci_attempt.outcome == 'failure'
        run: |
          echo "=== npm ci failed! ==="
          npm ci --loglevel=verbose 2>&1 | tail -50

      - name: Fallback - Try npm install
        if: steps.npm_ci_attempt.outcome == 'failure'
        run: |
          echo "=== Falling back to npm install ==="
          rm -rf node_modules package-lock.json
          npm install
          npm run build || echo "Build failed - check package.json scripts"

      - name: Install dependencies (with retry)
        if: steps.npm_ci_attempt.outcome == 'failure'
        run: |
          echo "=== Installing dependencies using npm install ==="
          npm install --no-audit --no-fund

      - name: Build application
        run: npm run build || echo "Build script missing or failed"
        env:
          NODE_ENV: production
