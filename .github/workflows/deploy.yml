name: Deploy to VPS (Debug)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build application
        run: npm run build
        env:
          NODE_ENV: production

      # Step 1: Just test SSH connection
      - name: 1. Test SSH Connection
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script: |
            echo "SSH Test: $(date)"
            echo "User: $(whoami)"
            echo "Hostname: $(hostname)"

      # Step 2: Check if directory exists
      - name: 2. Check App Directory
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script: |
            if [ -d "/var/www/ai-job-backend" ]; then
              echo "✅ Directory exists"
              ls -la /var/www/ai-job-backend
            else
              echo "❌ Directory does NOT exist"
              echo "Creating directory..."
              sudo mkdir -p /var/www/ai-job-backend
              sudo chown -R $USER:$USER /var/www/ai-job-backend
            fi

      # Step 3: Check git deploy key
      - name: 3. Check Deploy Key
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script: |
            echo "Checking deploy key..."
            ls -la ~/.ssh/
            echo "Testing GitHub connection..."
            ssh -T git@github.com -i ~/.ssh/github_deploy_key -o StrictHostKeyChecking=no || echo "Deploy key test done"

      # Step 4: Clone or Pull
      - name: 4. Clone/Pull Repository
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script: |
            cd /var/www/ai-job-backend
            export GIT_SSH_COMMAND="ssh -i ~/.ssh/github_deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=no"
            
            if [ -d ".git" ]; then
              echo "Pulling latest code..."
              git pull origin main
            else
              echo "Cloning repository..."
              git clone git@github.com:yourusername/your-repo.git .
            fi
            echo "Current commit: $(git rev-parse HEAD)"

      # Step 5: Install and Build
      - name: 5. Install Dependencies
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script: |
            cd /var/www/ai-job-backend
            npm install --omit=dev --no-audit --no-fund

      - name: 6. Build App
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script: |
            cd /var/www/ai-job-backend
            npm run build

      # Step 6: PM2 Restart
      - name: 7. Restart with PM2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script: |
            cd /var/www/ai-job-backend
            echo "Current PM2 processes:"
            pm2 list
            
            if pm2 list | grep -q "ai-job-backend"; then
              echo "Reloading PM2..."
              pm2 reload ecosystem.config.js --update-env
            else
              echo "Starting PM2..."
              pm2 start ecosystem.config.js
            fi
            pm2 save
            
            echo "Updated PM2 processes:"
            pm2 list
            
            echo "App running on port:"
            netstat -tlnp | grep node || echo "No node process found"

      # Step 7: Final Check
      - name: 8. Health Check
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script: |
            echo "=== FINAL STATUS ==="
            echo "App directory: /var/www/ai-job-backend"
            echo "Node version: $(node --version)"
            echo "NPM version: $(npm --version)"
            echo "PM2 status:"
            pm2 list
            echo "App logs (last 10 lines):"
            pm2 logs ai-job-backend --lines 10 --nostream